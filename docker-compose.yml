# AngkaSara — deploy PRODUKSI (PostgreSQL). App-only (port 3000); TLS/reverse-proxy
# diatur di luar (mis. nginx/Cloudflare). Semua rahasia dari .env (lihat .env.example).
#
#   1) cp .env.example .env   lalu isi rahasianya
#   2) docker compose up -d --build          → db, migrasi, lalu app di :3000
#   3) docker compose run --rm seed          → isi data awal (SEKALI, lihat DEPLOY.md)
#
# Alur boot: db (healthy) → migrate (deploy migrasi lalu keluar) → app (serve).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-angkasara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-angkasara}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Port TIDAK diekspos ke host — DB hanya dijangkau lewat jaringan internal compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-angkasara} -d ${POSTGRES_DB:-angkasara}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Terapkan migrasi Postgres lalu keluar. Pakai image `builder` (Prisma CLI lengkap).
  migrate:
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["npx", "prisma", "migrate", "deploy", "--config", "prisma/postgres/prisma.config.ts"]
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?wajib diisi di .env (>=32 karakter)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      STUDENT_SESSION_SECRET: ${STUDENT_SESSION_SECRET:?wajib diisi di .env (>=32 karakter)}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"

  # Isian data awal (jurusan, kelas, bank Check Point, 500 bacaan SKIBACA, 1 admin).
  # Sekali jalan: `docker compose run --rm seed`. Idempoten (aman diulang).
  seed:
    build:
      context: .
      target: builder
    profiles: ["seed"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@smkn1badegan.sch.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?wajib diisi di .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
    command: ["sh", "-lc", "npm run seed && npm run seed:skibaca && npm run seed:admin"]
    restart: "no"

volumes:
  pgdata:
